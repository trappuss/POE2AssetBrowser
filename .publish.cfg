# Settings for publish.bat. Blank means "work it out automatically".
# Edit any value and re-run publish.bat.
REPO=POE2AssetBrowser
VISIBILITY=public
# VERSION blank -> read from the VERSION file (currently 0.9.0). Bump it in VERSION (and CMakeLists.txt).
VERSION=
TAG_PREFIX=v
# Release notes come from CHANGELOG.md.
NOTES=CHANGELOG.md
# ASSETS blank -> attach everything in dist\ (run package-release.bat first to build the win64 zip),
#   plus an auto source zip. Set explicit paths to override.
ASSETS=
# WIKI: the folder of .md pages published as the GitHub wiki.
WIKI=wiki
# BRANCH blank -> the repo's default branch (main).
BRANCH=
# SKIP_RELEASE=1 makes it a code-only push (upload main, no release).
SKIP_RELEASE=0
